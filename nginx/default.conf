server {
    # Alterado para 8080 para evitar conflitos com outros serviços na máquina host,
    # uma prática comum ao usar network_mode: "host".
    listen 8080;
    server_name localhost;

    root /var/www/html/public;
    index index.php;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # No modo de rede "host", o Nginx deve se conectar ao PHP via localhost (127.0.0.1),
        # pois ambos estão compartilhando a mesma interface de rede do seu computador.
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
