services:
    php:
        build:
            context: .
            dockerfile: Dockerfile.dev
            args:
                PUID: 1000 # Substitua pelo seu UID se for diferente
                PGID: 1000 # Substitua pelo seu GID se for diferente
                DOCKER_GID: 998 # Substitua pelo GID que você encontrou no Passo 1
        env_file:
            - .env
        environment:
            APP_ENV: development
        volumes:
            # Monta o socket do Docker do host para que possamos usar comandos docker de dentro do container
            - /var/run/docker.sock:/var/run/docker.sock
            # Monta a configuração do Git do host para que o container use as mesmas credenciais
            - ~/.gitconfig:/home/www-data/.gitconfig:ro
            - ./:/var/www/html:cached
            - vendor:/var/www/html/vendor:delegated
        ports:
            - "9000:9000" # se quiser expor para debug
        mem_limit: 800m
        cpus: 0.5
        healthcheck:
            test: [ "CMD-SHELL", "lsof -i tcp:9000 || exit 1" ] # Ou netstat -tln | grep 9000
            interval: 10s
            timeout: 5s
            retries: 5

    nginx:
        image: nginx:alpine
        depends_on:
            php:
                condition: service_healthy
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www/html:ro
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        mem_limit: 200m
        cpus: 0.2

    vite:
        build:
            context: .
            dockerfile: Dockerfile.vite
        working_dir: /app
        volumes:
            - ./:/app
            - node_modules:/app/node_modules
        ports:
            - "5173:5173"
        environment:
            CHOKIDAR_USEPOLLING: "false"
        mem_limit: 300m
        cpus: 0.2

    db:
        image: mysql:8.0
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: root123
            MYSQL_DATABASE: laravel
            MYSQL_USER: admin
            MYSQL_PASSWORD: root1234
        volumes:
            - db_data:/var/lib/mysql
        healthcheck:
            test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "admin", "-proot1234" ]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 20s
        ports:
            - "3307:3306"

volumes:
    vendor:
    node_modules:
    db_data:
