services:
    php:
        build:
            context: .
            dockerfile: Dockerfile.dev
            args:
                PUID: 1000
                PGID: 1000
                DOCKER_GID: 999
        env_file:
            - .env
        ports:
            - "9000:9000"
        volumes:
            # Monta o socket do Docker do host
            - /var/run/docker.sock:/var/run/docker.sock
            # Volume principal com cache otimizado para performance
            - ./:/var/www/html:delegated
            # Volumes nomeados para dependencies - MUITO mais rápido
            - node_modules:/var/www/html/node_modules
            - vendor:/var/www/html/vendor
        depends_on:
            db:
                condition: service_healthy
        # Reduzido para evitar sobrecarregar o sistema
        mem_limit: 2g
        cpus: 1.5
        healthcheck:
            test: [ "CMD-SHELL", "nc -z localhost 9000 || exit 1" ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s

    nginx:
        image: nginx:alpine
        depends_on:
            php:
                condition: service_healthy
        ports:
            - "8080:80"
        volumes:
            # Read-only para melhor performance
            - ./public:/var/www/html/public:ro
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        mem_limit: 128m
        cpus: 0.2

    vite:
        build:
            context: .
            dockerfile: Dockerfile.vite
        working_dir: /app
        ports:
            - "5173:5173"
        volumes:
            - ./:/app:delegated
            - node_modules:/app/node_modules
        environment:
            # Polling desabilitado para melhor performance
            CHOKIDAR_USEPOLLING: "false"
            VITE_HOST: "0.0.0.0"
        mem_limit: 256m
        cpus: 0.3

    db:
        image: mysql:8.0
        restart: unless-stopped
        ports:
            - "3307:3306"
        environment:
            MYSQL_ROOT_PASSWORD: root123
            MYSQL_DATABASE: laravel
            MYSQL_USER: admin
            MYSQL_PASSWORD: root1234
        volumes:
            - db_data:/var/lib/mysql
        healthcheck:
            test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "admin", "-proot1234" ]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 30s
        # Configurações otimizadas do MySQL
        command: >
            --innodb-buffer-pool-size=256M --innodb-log-file-size=64M --max-connections=50 --query-cache-size=0 --query-cache-type=0

volumes:
    vendor:
    node_modules:
    db_data:
