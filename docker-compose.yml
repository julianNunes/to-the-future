services:
  php:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/var/www/html:cached
      - vendor:/var/www/html/vendor
    environment:
      APP_ENV: development
      DB_HOST: db
      DB_DATABASE: laravel
      DB_USERNAME: admin
      DB_PASSWORD: root1234
    mem_limit: 800m
    cpus: 0.5

  nginx:
    image: nginx:alpine
    depends_on:
      - php
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 200m
    cpus: 0.2

  vite:
    image: node:18-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - './nginx/default.conf:/etc/nginx/conf.d/default.conf:ro'
      - ./:/var/www/html:ro
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "false"
    mem_limit: 300m
    cpus: 0.2

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: laravel
      MYSQL_USER: admin
      MYSQL_PASSWORD: root1234
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-u","admin","-proot1234"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 20s
    ports:
      - "3307:3306"

volumes:
  vendor:
  node_modules:
  db_data:
