services:
    php:
        build:
            context: .
            dockerfile: Dockerfile.dev
            args:
                PUID: 1000 # Substitua pelo seu UID se for diferente
                PGID: 1000 # Substitua pelo seu GID se for diferente
                DOCKER_GID: 999
        env_file:
            - .env
        network_mode: "host"
        volumes:
            # Monta o socket do Docker do host para que possamos usar comandos docker de dentro do container
            - /var/run/docker.sock:/var/run/docker.sock
            - ./:/var/www/html:cached
            # Compartilha o volume node_modules para que as ferramentas de front-end (Prettier, ESLint) funcionem
            - node_modules:/var/www/html/node_modules
            - vendor:/var/www/html/vendor:delegated
        depends_on:
            db:
                condition: service_healthy
        mem_limit: 1g
        cpus: 1.0
        healthcheck:
            test: [ "CMD-SHELL", "lsof -i tcp:9000 || exit 1" ] # Ou netstat -tln | grep 9000
            interval: 10s
            timeout: 5s
            retries: 5

    nginx:
        image: nginx:alpine
        depends_on:
            php:
                condition: service_healthy
        volumes:
            - ./:/var/www/html:ro
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        network_mode: "host"
        mem_limit: 200m
        cpus: 0.2

    vite:
        build:
            context: .
            dockerfile: Dockerfile.vite
        working_dir: /app
        volumes:
            - ./:/app
            - node_modules:/app/node_modules
        network_mode: "host"
        environment:
            CHOKIDAR_USEPOLLING: "false"
        mem_limit: 300m
        cpus: 0.2

    db:
        image: mysql:8.0
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: root123
            MYSQL_DATABASE: laravel
            MYSQL_USER: admin
            MYSQL_PASSWORD: root1234
        volumes:
            - db_data:/var/lib/mysql
        network_mode: "host"
        healthcheck:
            # Alterado para verificar a porta 3307, que usaremos para evitar conflitos.
            test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-P", "3307", "-u", "admin", "-proot1234" ]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 20s
        # Adicionado para rodar o MySQL na porta 3307 e desativar o plugin X (porta 33060) para evitar conflitos no modo "host".
        command: --port=3307 --skip-mysqlx

volumes:
    vendor:
    node_modules:
    db_data:
